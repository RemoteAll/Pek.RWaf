[package]
name = "pek-rwaf"
version = "0.2.0"
edition = "2024"
description = "Pek Web 防火墙（Rust）：规则引擎 + IP/爬虫分级（放行搜索引擎与 GEO-AI 抓取、拦截恶意爬虫）+ SQLi/XSS/路径穿越检测 + CC 限流 + 接口级多策略限流（对齐 C# DH.RateLimter），接入 dhrust 中间件"
authors = ["PeiKeSmart"]
license = "MIT"

[dependencies]
# DH 基础库（Web 请求类型 + 日志 + 配置管线：TOML 配置类的补齐/容错/原子写）
dhrust = { path = "../DH.RustBase", features = ["net", "toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 配置文件（`Config/Waf.toml`）读写：条目结构由 dhrust `TomlConfig<T>` 负责，这里只作类型基准
toml = "1"
# 规则引擎正则（IsMatch 操作符；纯 Rust、可全平台 zig 交叉编译）
regex = "1"

[dev-dependencies]
bytes = "1"
# 中间件/guard 端到端测试（Router → handler 异步链）
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = "thin"
strip = true
incremental = true

# 日常调测档（与生态各仓一致）：继承 release 的优化等级，但关闭 LTO、并行 codegen + 增量。
# 本库只被宿主以 path 依赖引入，本机验证 `cargo check` 即可；需要跑起来时用 `cargo build --profile fast`。
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
