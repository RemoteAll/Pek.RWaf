[package]
name = "pek-rwaf"
version = "0.1.0"
edition = "2024"
description = "Pek Web 防火墙（Rust）：规则引擎 + IP/爬虫分级（放行搜索引擎与 GEO-AI 抓取、拦截恶意爬虫）+ SQLi/XSS/路径穿越检测 + CC 限速，对齐 C# Pek.WAF 并接入 dhrust 中间件"
authors = ["PeiKeSmart"]
license = "MIT"

[dependencies]
# DH 基础库（Web 请求类型 + 日志）
dhrust = { path = "../DH.RustBase", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 规则引擎正则（IsMatch 操作符；纯 Rust、可全平台 zig 交叉编译）
regex = "1"

[dev-dependencies]
bytes = "1"

[profile.release]
lto = "thin"
strip = true
incremental = true
